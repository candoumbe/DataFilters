name: typescript-delivery

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'src/typescript/**'
      - '.github/workflows/typescript-*.yml'
  pull_request:
    paths:
      - 'src/typescript/**'
      - '.github/workflows/typescript-*.yml'

jobs:
  typescript-deploy:
    name: Build and publish TypeScript package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'src/typescript/package-lock.json'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          cd src/typescript
          npm ci

      - name: Lint
        run: |
          cd src/typescript
          npm run lint

      - name: Build
        run: |
          cd src/typescript
          npm run build

      - name: Test
        run: |
          cd src/typescript
          npm test

      - name: Publish to npm
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        run: |
          cd src/typescript
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
